<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Control - Asistente</title>
    <style>
        :root { color-scheme: dark; }
        body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 40px 16px; }
        .container { max-width: 800px; margin: auto; background: #313244; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,.3); }
        h1 { color: #b4befe; text-align: center; }
        h2 { border-bottom: 2px solid #45475a; padding-bottom: 10px; color: #f38ba8; }
        textarea { width: 100%; height: 120px; background: #181825; color: #cdd6f4; border: 1px solid #45475a; border-radius: 5px; padding: 10px; font-size: 14px; box-sizing: border-box; margin-bottom: 15px; resize: vertical; }
        button { background: #89b4fa; color: #11111b; border: 0; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #74c7ec; }
        .status { margin-top: 10px; min-height: 20px; font-size: 14px; color: #a6e3a1; font-weight: bold; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Configuración del Asistente</h1>
        <h2>Modificar Personalidad</h2>
        <textarea id="personalityText">__PERSONALITY__</textarea>
        <button type="button" onclick="updatePersonality()">Guardar Personalidad</button>
        <div id="statusPersonality" class="status"></div>
        <h2>Subir Notas de Reunión</h2>
        <textarea id="notesText" placeholder="Pegá acá las notas de la reunión..."></textarea>
        <button type="button" onclick="uploadNotes()">Procesar Notas</button>
        <div id="statusNotes" class="status"></div>
    </main>
    <script>
        async function updatePersonality() {
            const status = document.getElementById('statusPersonality');
            status.innerText = 'Guardando...';
            const response = await fetch('/update-personality', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({personality_text: document.getElementById('personalityText').value}) });
            status.innerText = response.ok ? 'Personalidad actualizada con éxito.' : 'Error al actualizar.';
        }
        async function uploadNotes() {
            const notes = document.getElementById('notesText');
            const status = document.getElementById('statusNotes');
            if (!notes.value.trim()) { status.innerText = 'Las notas están vacías.'; return; }
            status.innerText = 'Procesando notas y enviando a Notion...';
            const response = await fetch('/process-notes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({notes_text: notes.value, default_title: 'Reunión subida desde Web'}) });
            status.innerText = response.ok ? 'Notas procesadas correctamente.' : 'Error al procesar notas.';
            if (response.ok) notes.value = '';
        }
    </script>
</body>
</html>
