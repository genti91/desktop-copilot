<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Desktop Co-Pilot</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #11111b;
            --surface: #1e1e2e;
            --surface-2: #181825;
            --line: #313244;
            --line-strong: #45475a;
            --text: #cdd6f4;
            --muted: #9399b2;
            --accent: #89b4fa;
            --accent-soft: rgba(137, 180, 250, .14);
            --err: #f38ba8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px rgba(0, 0, 0, .22);
            padding: 32px 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-weight: 650;
            letter-spacing: -.01em;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(140deg, var(--accent), #cba6f7);
            color: #11111b;
            font-size: 15px;
        }

        h1 { margin: 0 0 6px; font-size: 20px; font-weight: 620; letter-spacing: -.02em; }

        p.hint { margin: 0 0 22px; color: var(--muted); font-size: 14px; }

        label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

        input[type="password"] {
            width: 100%;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--line-strong);
            border-radius: 9px;
            padding: 11px 13px;
            font: inherit;
            font-size: 14px;
            transition: border-color .15s, box-shadow .15s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            width: 100%;
            margin-top: 18px;
            border: 0;
            border-radius: 9px;
            padding: 11px 18px;
            font: inherit;
            font-size: 14px;
            font-weight: 620;
            cursor: pointer;
            background: var(--accent);
            color: #11111b;
        }

        button:hover { filter: brightness(1.08); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .message {
            margin-top: 16px;
            min-height: 20px;
            font-size: 13.5px;
            font-weight: 550;
            color: var(--err);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <span class="brand-mark">◆</span>
            <span>Desktop Co-Pilot</span>
        </div>
        <h1>Entrar al panel</h1>
        <p class="hint">Necesitás la password del backend para administrar el asistente.</p>
        <form method="post" action="/login">
            <input type="hidden" name="next" value="__NEXT__">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
            <button type="submit">Entrar</button>
        </form>
        <div class="message">__MESSAGE__</div>
    </main>
</body>
</html>
