[env:xiao_esp32s3]
; MicroLink es un componente de ESP-IDF (C + CMake), asi que Arduino tiene que
; compilar como componente de IDF y no como framework precompilado: es la unica
; forma de meter codigo IDF en el mismo binario.
;
; El platform oficial de PlatformIO se quedo en IDF 5.1, y microlink pide
; esp_driver_tsens, que recien existe desde 5.3. pioarduino es el fork que trae
; Arduino 3.x sobre IDF 5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.filesystem = littlefs
; Con IDF la tabla de particiones deja de venir del board. Es la misma que traia
; el default de 8 MB (dos particiones OTA + un area de datos), pero explicita.
board_build.partitions = partitions.csv

extra_scripts = pre:scripts/build_number.py

build_flags = 
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

lib_deps =
    ; 2.x es la primera que usa el driver I2S nuevo de IDF 5. Con la 1.9.9 el
    ; micrófono no puede: ESP-IDF aborta si conviven el driver viejo y el nuevo,
    ; y el viejo devuelve cero muestras en PDM. Va por git porque el registro de
    ; PlatformIO todavía no publica la 2.4.2.
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2
    adafruit/Adafruit NeoPixel
    ; LovyanGFX en vez de TFT_eSPI. El driver de bajo nivel de TFT_eSPI para S3
    ; escribe los registros SPI a mano y con Arduino 3.x / IDF 5.5 no hay
    ; combinacion que funcione: con USE_HSPI_PORT la base de registros cae sobre
    ; UART0 y no dibuja, y con la base correcta tft.init() se cuelga. Es el issue
    ; 3329 de TFT_eSPI, sin arreglo upstream. LovyanGFX usa los drivers modernos
    ; y mantiene una API casi identica. La configuracion del panel esta en
    ; include/panel.h, no en build_flags.
    lovyan03/LovyanGFX @ ^1.2.0
    tzapu/WiFiManager
    bblanchon/ArduinoJson @ ^7.0.0
