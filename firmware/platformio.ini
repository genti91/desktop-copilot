[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.filesystem = littlefs

build_flags = 
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D USER_SETUP_LOADED=1
  
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D USE_HSPI_PORT=1
    
    -D TFT_MISO=-1
    -D TFT_MOSI=9
    -D TFT_SCLK=7
    -D TFT_DC=8
    -D TFT_RST=44
    -D TFT_CS=-1
    
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    
    -D SPI_FREQUENCY=80000000 
    -D SPI_READ_FREQUENCY=80000000

lib_deps = 
    earlephilhower/ESP8266Audio @ ^1.9.9
    adafruit/Adafruit NeoPixel
    bodmer/TFT_eSPI
    tzapu/WiFiManager
