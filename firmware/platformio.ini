[env:xiao_esp32s3]
; MicroLink es un componente de ESP-IDF (C + CMake), asi que Arduino tiene que
; compilar como componente de IDF y no como framework precompilado: es la unica
; forma de meter codigo IDF en el mismo binario.
;
; El platform oficial de PlatformIO se quedo en IDF 5.1, y microlink pide
; esp_driver_tsens, que recien existe desde 5.3. pioarduino es el fork que trae
; Arduino 3.x sobre IDF 5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.filesystem = littlefs
; Con IDF la tabla de particiones deja de venir del board. Es la misma que traia
; el default de 8 MB (dos particiones OTA + un area de datos), pero explicita.
board_build.partitions = partitions.csv

extra_scripts = pre:scripts/build_number.py

build_flags = 
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D USER_SETUP_LOADED=1

    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D USE_HSPI_PORT=1

    -D TFT_MISO=-1
    -D TFT_MOSI=9
    -D TFT_SCLK=7
    -D TFT_DC=8
    -D TFT_RST=44
    -D TFT_CS=-1

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

; TFT_eSPI va vendorizada en lib/ con un parche de una linea, no como
; dependencia. En el S3 la libreria usa REG_SPI_BASE(SPI_PORT) para calcular la
; base de registros del periferico, y esa macro cambio de semantica entre SDKs:
;
;   Arduino 2.0.17: (((i)>=2) ? (DR_REG_SPI2_BASE + (i-2)*0x1000) : 0)
;   IDF 5.5:        (((i)==2) ? DR_REG_SPI2_BASE : (DR_REG_SPI0_BASE - i*0x1000))
;
; Con USE_HSPI_PORT queda SPI_PORT 3, que en el SDK nuevo cae en la rama del
; else y devuelve 0x60000000: los registros de UART0. La pantalla quedaba negra
; con la luz de fondo prendida. La libreria trae su propia definicion, correcta,
; pero detras de un #ifndef que nunca se cumple porque el SDK ya la definio; el
; parche es el #undef que la deja ganar.
;
; Ver lib/TFT_eSPI/Processors/TFT_eSPI_ESP32_S3.h.
;
; TFT_BL no se declara a proposito. La luz de fondo la maneja display.cpp por su
; cuenta, con PIN_TFT_BL: es D6 = GPIO43 = U0TXD, y el gestor de perifericos de
; Arduino 3.x no entrega ese pin, asi que el digitalWrite() de TFT_eSPI falla con
; "IO 43 is not set as GPIO" y no hace nada. Del lado nuestro se maneja por el
; driver de GPIO de IDF, que no consulta esa tabla.

lib_deps =
    ; 2.x es la primera que usa el driver I2S nuevo de IDF 5. Con la 1.9.9 el
    ; micrófono no puede: ESP-IDF aborta si conviven el driver viejo y el nuevo,
    ; y el viejo devuelve cero muestras en PDM. Va por git porque el registro de
    ; PlatformIO todavía no publica la 2.4.2.
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2
    adafruit/Adafruit NeoPixel
    tzapu/WiFiManager
    bblanchon/ArduinoJson @ ^7.0.0
